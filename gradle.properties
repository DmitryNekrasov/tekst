kotlin.code.style=official

# The Kotlin/JS IR incremental cache turns unpaired surrogates in string literals into '?' (a regression of KT-31614).
kotlin.incremental.js.ir=false

org.gradle.configuration-cache=true
# Kotlin/Native runs in the Gradle daemon, and with the configuration cache its link tasks run in parallel (KT-70915),
# so the default 512 MB heap is not enough.
org.gradle.jvmargs=-Xmx4g
